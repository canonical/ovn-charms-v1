###############################################################################
# [ WARNING ]
# Configuration file maintained by Juju. Local changes may be overwritten.
# Configuration managed by ovn-dedicated-chassis
###############################################################################
[DEFAULT]
debug = {{ options.debug }}
nova_metadata_host = {{ nova_compute.metadata_host }}
nova_metadata_protocol = {{ nova_compute.metadata_protocol }}
nova_metadata_port = {{ nova_compute.metadata_port }}
nova_metadata_insecure = false
{% if nova_compute.metadata_ca_cert %}
auth_ca_cert = /etc/neutron/nova-metadata-ca.crt
{% endif %}
metadata_proxy_shared_secret = {{ nova_compute.metadata_shared_secret }}

[ovs]
ovsdb_connection = tcp:127.0.0.1:6640

[ovn]
ovn_sb_connection = {{ ','.join(ovsdb.db_sb_connection_strs) }}
ovn_sb_private_key = {{ options.ovn_key }}
ovn_sb_certificate = {{ options.ovn_cert }}
ovn_sb_ca_cert = {{ options.ovn_ca_cert }}
